<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rede de colaboração IMC/UNIFEI</title>
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/layout.css">
<link rel="stylesheet" href="/src/styles/sidebar.css">
<link rel="stylesheet" href="/src/styles/controls.css">
<link rel="stylesheet" href="/src/styles/graph.css">
<link rel="stylesheet" href="/src/styles/hud.css">
<link rel="stylesheet" href="/src/styles/details.css">
<link rel="stylesheet" href="/src/styles/responsive.css">
</head>
<body>
<aside id="nav">
  <h1>Rede de colaboração IMC/UNIFEI</h1>
  <div class="mu" id="stats"></div>

  <h2>Buscar pesquisador</h2>
  <input type="text" id="q" placeholder="Digite um nome…" autocomplete="off" aria-label="Buscar pesquisador" aria-controls="res">
  <div class="res" id="res" role="listbox"></div>

  <section class="acc" data-acc="dims" data-open="1">
    <div class="acc-h"><button type="button" class="acc-t">Dimensões de colaboração</button></div>
    <div class="acc-b"><div id="dims"></div></div>
  </section>

  <section class="acc" data-acc="time" data-open="1">
    <div class="acc-h"><button type="button" class="acc-t">Janela temporal</button></div>
    <div class="acc-b">
      <div class="row">Período: <b class="num" id="y0v"></b>&nbsp;–&nbsp;<b class="num" id="y1v"></b><span class="cnt num" id="ywin" title="Atividades distintas no período (com os demais filtros aplicados)"></span></div>
      <div class="dual" id="yr">
        <div class="trk"></div><div class="fill" id="yfill"></div>
        <input type="range" class="rng" id="y0" aria-label="Ano inicial">
        <input type="range" class="rng" id="y1" aria-label="Ano final">
      </div>
      <div class="ends mu num"><span id="ymin"></span><span id="ymax"></span></div>
    </div>
  </section>

  <section class="acc" data-acc="types" data-open="1">
    <div class="acc-h"><button type="button" class="acc-t">Tipo de relação (arestas)</button>
      <input type="checkbox" class="master" id="typesAll" aria-label="Marcar ou desmarcar todos os tipos de relação" title="Marcar/desmarcar todos"></div>
    <div class="acc-b"><div id="types"></div></div>
  </section>

  <section class="acc" data-acc="grps" data-open="0">
    <div class="acc-h"><button type="button" class="acc-t">Área do IMC</button>
      <input type="checkbox" class="master" id="grpsAll" aria-label="Marcar ou desmarcar todas as áreas do IMC" title="Marcar/desmarcar todas"></div>
    <div class="acc-b"><div id="grps"></div></div>
  </section>

  <section class="acc" data-acc="net" data-open="1">
    <div class="acc-h"><button type="button" class="acc-t">Exibição da rede</button></div>
    <div class="acc-b">
      <label class="r"><input type="checkbox" id="extended"><span>Incluir pesquisadores sem colaboração com o IMC</span><span class="cnt num" id="extendedCount" title="Pesquisadores da fonte sem colaboração direta com o IMC"></span></label>
    </div>
  </section>

  <section class="acc" data-acc="look" data-open="0">
    <div class="acc-h"><button type="button" class="acc-t">Cores e layout</button></div>
    <div class="acc-b">
      <label class="r"><input type="radio" name="cm" value="inst" checked> Cor por instituto</label>
      <label class="r"><input type="radio" name="cm" value="area"> Cor por área do IMC</label>
      <label class="r"><input type="radio" name="lm" value="free" checked> Layout livre (por conexões)</label>
      <label class="r"><input type="radio" name="lm" value="area"> Layout separado por área</label>
    </div>
  </section>

  <section class="acc" data-acc="disp" data-open="0">
    <div class="acc-h"><button type="button" class="acc-t">Exibição</button></div>
    <div class="acc-b">
      <label class="r"><input type="checkbox" id="labImc" checked> Mostrar rótulos dos pesquisadores do IMC</label>
      <label class="r"><input type="checkbox" id="ext" checked> Mostrar externos (EXT)</label>
      <div class="row slider-label">Mín. de atividades em comum: <b class="num" id="mv">1</b></div>
      <input type="range" class="rng" id="ms" min="1" max="20" value="1" aria-label="Mínimo de atividades em comum">
      <p class="mu help" id="help"></p>
    </div>
  </section>
</aside>

<main>
  <canvas id="cv" aria-label="Grafo da rede de colaboração"></canvas>
  <div id="hud" class="glass hud" role="status" aria-live="polite"></div>
  <div id="cam" class="cam" role="toolbar" aria-label="Controles da câmera"></div>
  <div id="peso" class="glass peso-ctl" role="group" aria-label="Peso da colaboração"></div>
  <div id="tip" class="glass"></div>
</main>

<aside id="side" aria-live="polite"></aside>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
